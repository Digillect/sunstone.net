workflow: GitHubFlow/v1
assembly-versioning-scheme: MajorMinorPatch
strategies:
  - MergeMessage
  - TaggedCommit
  - Mainline
  - Fallback
branches:
  main:
    regex: ^master$|^main$
    label: alpha
    increment: Patch
    is-release-branch: false
    is-main-branch: true
  tags:
    regex: ^tags/v.+$
    label: ''
    source-branches: ['main']
    increment: None
    is-release-branch: true
    is-main-branch: true
  pull-request:
    regex: ^features?[/-](?<BranchName>.+)$
    label: '{BranchName}'
    source-branches: ['main']
    increment: Inherit
    prevent-increment:
      of-merged-branch: true
      when-current-commit-tagged: false

ignore:
  sha: []
merge-message-formats: {}